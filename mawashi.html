<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mawashi Colors · Salt Stats &amp; Sumo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Zen+Old+Mincho:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f1e9db;--surface:#fbf7ef;--ink:#26262b;--muted:#6f695d;--line:#e2d9c7;
    --clay:#a9742c;--clay-soft:#e6cf9f;--vermilion:#cf5a2c;--gold:#c8962f}
  @media(prefers-color-scheme:dark){:root{--bg:#171719;--surface:#212127;--ink:#ece4d4;--muted:#a49c8b;--line:#33333b;
    --clay:#d2a35c;--clay-soft:#40331d;--vermilion:#e5814f;--gold:#e0b558}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Inter',-apple-system,system-ui,sans-serif}
  h1,h2{font-family:'Zen Old Mincho',Georgia,serif}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:14px 16px 64px}
  header{background:
      repeating-linear-gradient(178deg, rgba(0,0,0,.14) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 44px),
      linear-gradient(160deg,#6e4826,#432a15);
    color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:18px;border:1px solid #38230f;
    box-shadow:0 8px 22px rgba(50,30,10,.28)}
  .hbrand{display:flex;align-items:center;gap:15px}
  .hdicon{width:52px;height:52px;flex:0 0 auto;filter:drop-shadow(0 2px 5px rgba(0,0,0,.3))}
  header h1{font-size:23px;margin:0 0 2px;font-weight:900}
  header p{margin:0;opacity:.9;font-size:13.5px}
  .homecrest{width:34px;height:34px;border-radius:50%;flex:0 0 auto;margin-left:auto;overflow:hidden;
    background:#efe7d5;box-shadow:0 0 0 1px rgba(255,255,255,.30),0 2px 6px rgba(0,0,0,.28)}
  .homecrest img{width:100%;height:100%;object-fit:cover;display:block}
  .lede{font-size:15px;line-height:1.5;margin:0 2px 18px}
  .lede b{color:var(--ink)}
  .frow{display:flex;align-items:center;gap:11px;padding:5px 2px}
  .frow .sw{width:16px;height:16px;border-radius:4px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .frow .fname{width:104px;flex:0 0 auto;font-size:13.5px;font-weight:600;text-transform:capitalize}
  .frow .bar{flex:1;height:12px;background:rgba(0,0,0,.06);border-radius:6px;overflow:hidden}
  .frow .fill{display:block;height:100%;border-radius:6px}
  .frow .fn{width:26px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
  .frow.lead .fname{font-weight:800} .frow.lead .fn{color:var(--gold)}
  .sechead{font-family:'Zen Old Mincho',Georgia,serif;font-size:14px;font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;color:var(--clay);margin:26px 2px 12px;display:flex;align-items:center;gap:12px}
  .sechead::after{content:"";flex:1;height:1px;background:var(--line)}
  .fam{margin:0 0 16px}
  .fam .ft{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;text-transform:capitalize;margin:0 0 7px}
  .fam .ft .sw{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .fam .ft .c{color:var(--muted);font-weight:600}
  .who{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:5px 11px 5px 7px;font-size:12.5px}
  .chip .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
  .chip b{font-weight:700} .chip .col{color:var(--muted)}
  .foot{margin-top:24px;font-size:12px;color:var(--muted);line-height:1.55;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hbrand">
      <svg class="hdicon" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="58" fill="#efe7d5"/>
        <circle cx="60" cy="60" r="55.5" fill="none" stroke="#c06a34" stroke-width="4.5"/>
        <circle cx="60" cy="60" r="49" fill="none" stroke="#c06a34" stroke-width="1.3"/>
        <rect x="20" y="52" width="80" height="16" rx="4" fill="#211a12" transform="rotate(-12 60 60)"/>
        <rect x="52" y="44" width="16" height="34" rx="4" fill="#b23a2e" transform="rotate(-12 60 60)"/>
      </svg>
      <div>
        <h1>Mawashi Colors</h1>
        <p>What the makuuchi wears.</p>
      </div>
      <a class="homecrest" href="/" title="Salt Stats &amp; Sumo · home" aria-label="Home"><img src="/salt-stats-sumo-badgeold.png" alt=""></a>
    </div>
  </header>

  <p class="lede" id="lede"></p>
  <div id="tally"></div>

  <h2 class="sechead">Who wears what</h2>
  <div id="who"></div>

  <p class="foot" id="foot"></p>
</div>

<script>
  /* MAWASHI_TALLY — generated from the Master Rikishi "Mawashi Color" field. Family = the last
     word of each belt-color note (navy, midnight, slate all fall under blue). Do not hand-edit. */
  const MAWASHI_TALLY = {"scope": "Nagoya 2026", "total": 42, "leader": {"family": "blue", "count": 14}, "families": [{"family": "blue", "hex": "#3a4a6b", "count": 14, "members": [{"name": "Takayasu", "color": "dark blue"}, {"name": "Gonoyama", "color": "midnight blue"}, {"name": "Abi", "color": "midnight blue"}, {"name": "Fujinokawa", "color": "medium blue"}, {"name": "Kotoeiho", "color": "medium slate blue"}, {"name": "Hoshoryu", "color": "dark navy blue"}, {"name": "Fujiryoga", "color": "dark blue"}, {"name": "Asahakuryu", "color": "dark blue"}, {"name": "Wakatakakage", "color": "deep navy blue"}, {"name": "Fujiseiun", "color": "midnight blue"}, {"name": "Onosato", "color": "midnight blue"}, {"name": "Tobizaru", "color": "light grey blue"}, {"name": "Wakanosho", "color": "navy blue"}, {"name": "Kazuma", "color": "midnight blue"}]}, {"family": "purple", "hex": "#6a3d9a", "count": 10, "members": [{"name": "Nishikifuji", "color": "light plum purple"}, {"name": "Hiradoumi", "color": "midnight purple"}, {"name": "Kirishima", "color": "deep dark brownish purple"}, {"name": "Oho", "color": "dark purple"}, {"name": "Churanoumi", "color": "purple"}, {"name": "Asanoyama", "color": "deep plum purple"}, {"name": "Roga", "color": "dark blue purple"}, {"name": "Yoshinofuji", "color": "midnight purple"}, {"name": "Daiseizan", "color": "royal purple"}, {"name": "Takerufuji", "color": "medium lilac purple"}]}, {"family": "red", "hex": "#9b3b52", "count": 5, "members": [{"name": "Atamifuji", "color": "dark muted raspberry red"}, {"name": "Takanosho", "color": "red"}, {"name": "Mitakeumi", "color": "raspberry red"}, {"name": "Asakoryu", "color": "red"}, {"name": "Daieisho", "color": "dark raspberry red"}]}, {"family": "grey", "hex": "#8c8c92", "count": 4, "members": [{"name": "Kinbozan", "color": "grey"}, {"name": "Onokatsu", "color": "medium grey"}, {"name": "Oshoma", "color": "light grey"}, {"name": "Kotoshoho", "color": "light blue grey"}]}, {"family": "black", "hex": "#26262b", "count": 3, "members": [{"name": "Shishi", "color": "black"}, {"name": "Shodai", "color": "black"}, {"name": "Wakamotoharu", "color": "black"}]}, {"family": "green", "hex": "#2f8f6b", "count": 3, "members": [{"name": "Kotozakura", "color": "light turquoise green"}, {"name": "Aonishiki", "color": "British racing green"}, {"name": "Ichiyamamoto", "color": "jade green"}]}, {"family": "brown", "hex": "#7a5230", "count": 2, "members": [{"name": "Hakunofuji", "color": "medium grey brown"}, {"name": "Chiyoshoma", "color": "golden brown"}]}, {"family": "pink", "hex": "#e59ab5", "count": 1, "members": [{"name": "Ura", "color": "cherry blossom pink"}]}]};

  (function(){
    const T=MAWASHI_TALLY, fams=T.families, mx=fams[0].count;
    document.getElementById('lede').innerHTML =
      '<b>'+cap(T.leader.family)+' runs the dohyo.</b> '+T.leader.count+' of '+T.total+' wrestlers, about a third of the makuuchi, wear it.';
    let tb='';
    fams.forEach(f=>{
      const w=Math.round(100*f.count/mx), lead=f.family===T.leader.family?' lead':'';
      tb+='<div class="frow'+lead+'"><span class="sw" style="background:'+f.hex+'"></span>'+
          '<span class="fname">'+cap(f.family)+'</span>'+
          '<span class="bar"><span class="fill" style="width:'+w+'%;background:'+f.hex+'"></span></span>'+
          '<span class="fn">'+f.count+'</span></div>';
    });
    document.getElementById('tally').innerHTML=tb;
    let wh='';
    fams.forEach(f=>{
      let chips='';
      f.members.forEach(m=>{ chips+='<span class="chip"><span class="dot" style="background:'+f.hex+'"></span>'+
        '<b>'+esc(m.name)+'</b> <span class="col">'+esc(m.color)+'</span></span>'; });
      wh+='<div class="fam"><div class="ft"><span class="sw" style="background:'+f.hex+'"></span>'+
          cap(f.family)+' <span class="c">'+f.count+'</span></div><div class="who">'+chips+'</div></div>';
    });
    document.getElementById('who').innerHTML=wh;
    document.getElementById('foot').innerHTML =
      'Family is the last word of each belt-color note, so the near-shades sit together (navy, midnight, slate all read as blue). Current colors only, from Master Rikishi.';
  })();
  function cap(s){return s.replace(/(^|[ /])([a-z])/g,(m,p,c)=>p+c.toUpperCase());}
  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
</script>
<script>
/* surface-aware home crest: only /app means app, only the homepage means site; any other internal
   page is ambiguous and inherits the remembered surface. */
(function(){
  var s=null;
  try{ if(document.referrer){ var u=new URL(document.referrer);
    if(u.origin===location.origin && u.pathname!==location.pathname){
      if(u.pathname.indexOf('/app')===0) s='app';
      else if(u.pathname==='/' || u.pathname==='/index.html') s='site';
    } } }catch(e){}
  if(s){ try{ sessionStorage.setItem('ss_surface', s); }catch(e){} }
  else { try{ s = sessionStorage.getItem('ss_surface'); }catch(e){} }
  if(s==='app'){ var c=document.querySelector('.homecrest'); if(c){ c.setAttribute('href','/app'); c.setAttribute('title','Crew home'); } }
})();
</script>
</body>
</html>
