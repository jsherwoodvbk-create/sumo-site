name: Build Headshots
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = preview only (writes/commits nothing), 0 = build + commit crops"
        default: "1"
        required: true
      names:
        description: "Optional: comma-separated Ring Names to (re)build just those (leave blank for all)"
        default: ""
        required: false
permissions:
  contents: write
jobs:
  headshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install sharp
        run: npm install sharp --no-save
      - name: Build head-crops
        run: node build-headshots.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          NAMES: ${{ inputs.names }}
      - name: Commit crops
        if: ${{ inputs.dry_run == '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img/headshots
          git commit -m "Rebuild rikishi head-crops" || echo "no changes to commit"
          git push
