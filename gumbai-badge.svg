<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Gumbai badge (LOCKED v11) — mascot in the logo's terracotta double-ring on cream. Self-contained; use via <img src="gumbai-badge.svg">. -->
  <defs>
    <filter id="ink" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="petal" d="M0 0 C -7 -16 -5 -38 0 -50 C 5 -38 7 -16 0 0 Z"/>
    <g id="mum">
      <g><use href="#petal" transform="rotate(0)"/><use href="#petal" transform="rotate(30)"/><use href="#petal" transform="rotate(60)"/><use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(120)"/><use href="#petal" transform="rotate(150)"/><use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(210)"/><use href="#petal" transform="rotate(240)"/><use href="#petal" transform="rotate(270)"/><use href="#petal" transform="rotate(300)"/><use href="#petal" transform="rotate(330)"/></g>
      <g transform="scale(0.6)"><use href="#petal" transform="rotate(15)"/><use href="#petal" transform="rotate(45)"/><use href="#petal" transform="rotate(75)"/><use href="#petal" transform="rotate(105)"/><use href="#petal" transform="rotate(135)"/><use href="#petal" transform="rotate(165)"/><use href="#petal" transform="rotate(195)"/><use href="#petal" transform="rotate(225)"/><use href="#petal" transform="rotate(255)"/><use href="#petal" transform="rotate(285)"/><use href="#petal" transform="rotate(315)"/><use href="#petal" transform="rotate(345)"/></g>
