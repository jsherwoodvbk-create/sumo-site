name: Publish standings

on:
  workflow_call: {}              # lets fan-and-publish.yml chain this after the fan (confirmed live in repo 2026-09-19)
  workflow_dispatch: {}          # lets us run it by hand to test
  schedule:
    # Several attempts across the morning (UTC) = resilient to GitHub dropping any single cron run.
    # Rebuilds standings.html from sumo-api and the Gumbai snapshot from Notion, commits only if
    # they changed (so repeats are no-ops until new results land). Runs ~15 min after the sync
    # workflow, so Notion already holds the latest day before the Gumbai snapshot is rebuilt.
    - cron: "32 11 * * *"        # ~04:32 AM PT
    - cron: "32 13 * * *"        # ~06:32 AM PT
    - cron: "32 15 * * *"        # ~08:32 AM PT
    - cron: "32 17 * * *"        # ~10:32 AM PT
    - cron: "32 22 * * *"        # ~03:32 PM PT — afternoon backstop

permissions:
  contents: write                # allow the built-in token to commit

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # SPOILER-GATE TEST GATE (added 2026-08-01). Runs the Gumbai engine's unit tests against the
      # engine that's actually committed (test-engine.mjs imports ./functions/api/_engine.js). If ANY
      # check fails — a leaked spoiler token, a broken day-gate, a mis-gated champion — the job fails
      # HERE and nothing below runs, so a broken engine can never be committed or deployed. Pure Node,
      # no npm install needed. Requires test-engine.mjs at the repo root (committed alongside the engine).
      - name: Gumbai engine tests (spoiler gate)
        run: node test-engine.mjs

      - name: Rebuild standings.html from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node build-standings.mjs

      - name: Rebuild tomorrow's card (torikumi) from sumo-api
        # THE FIX (2026-09-22): wire the next-day matchup pull into the daily publish. gen-torikumi.mjs
        # pulls each published day's scheduled card (sumo-api /basho/{id}/torikumi/Makuuchi/{day}) into
        # tomorrow-card.json, which the Gumbai snapshot step below folds into the snapshot's ungated
        # `cards`/`upcoming` lanes (query_upcoming). Before this, the card only refreshed on a MANUAL
        # torikumi.yml run, so during a live basho Gumbai could hand out a stale "tomorrow's card." Now it
        # refreshes every publish. MUST run BEFORE gen-gumbai-snapshot.mjs (which reads the file off disk).
        #
        # SOURCE FRAMEWORK (2026-09-22): the lineup ALSO lands in Notion — gen-torikumi upserts each day's
        # `Lineup` onto the (Basho, Day #) Highlights row (the SAME key notion_push.py / ensureDayRow use,
        # so it converges to one clean row; the box's push later patches the transcript onto the same row).
        # BEST-EFFORT: it runs AFTER tomorrow-card.json is written and never throws, so a Notion hiccup
        # can't block the snapshot + standings publish, and the card falls back to the JSON. Needs the WRITE
        # token (NOTION_TOKEN_WRITE = sumo-notion-sync — the SAME secret sync-notion.yml already uses daily,
        # full-tracker r/w with Days already in scope, so no new secret and no new access). Without the
        # token the Notion write self-skips and only tomorrow-card.json is written. TOURNAMENT_PAGE_ID +
        # BASHO_LABEL join the per-basho flip (they default in-code to Aki, so this works either way).
        # FORCE_DAY=<n> overrides the auto next-day (testing only).
        continue-on-error: true
        env:
          NOTION_TOKEN_WRITE: ${{ secrets.NOTION_TOKEN_WRITE }}
          TOURNAMENT_PAGE_ID: "3351ade1-241f-8011-8987-d959538f54a0"
          BASHO_LABEL: "Aki 2026"
        run: node gen-torikumi.mjs

      - name: Rebuild Gumbai snapshot from Notion
        # Non-fatal: if the Notion pull hiccups the snapshot self-aborts and writes nothing
        # (leaving the last good one in place), and the standings publish below still runs.
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node gen-gumbai-snapshot.mjs

      - name: Rebuild the drinking-game board from Notion
        # THE FIX (2026-09-21): this step was missing, so the board never rebuilt on a fan/publish run.
        # Day 9 landed hands-off — Notion + the keystone went green — but the drinking-game board sat on
        # its last static state because nothing here regenerated it. gen-drinking-game.mjs reads the three
        # catchphrase tables (Sightings / Library / Days / Announcers) and re-emits drinking-game.html for
        # the current basho. Same defaults as the other generators (BASHO=202609, "Aki 2026",
        # TOURNAMENT_PAGE_ID baked in), so a live-basho run needs only NOTION_TOKEN.
        # Non-fatal by the same logic as the Gumbai + calendar snapshots: on an empty/failed Notion pull
        # the generator self-aborts and writes nothing, leaving the last good board in place, and the
        # commit + standings publish below still run.
        # NOTE: the catchphrase tables must be shared with the sumo-site-publisher integration (the one
        # behind NOTION_TOKEN) — the same token already reads them for the Gumbai snapshot, so if the
        # oracle knows this basho's catchphrases, this step has access too.
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node gen-drinking-game.mjs

      - name: Rebuild calendar snapshot from Notion
        # Builds calendar.json (public month-grid page) + functions/api/_calendar.js (the .ics feed).
        # Non-fatal by the same logic as the Gumbai snapshot: gen-calendar.mjs self-aborts and writes
        # nothing if the Notion pull comes back empty, leaving the last good calendar in place. Reads
        # 🏆 Bashos + 🤼 Master Rikishi, both already shared with the publish integration.
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node gen-calendar.mjs

      - name: Rebuild per-rikishi metrics (daily, with a backstop)
        # Refreshes rikishi-metrics.json for the dashboards. Gated to the 08:32 AM + 03:32 PM PT crons +
        # manual runs, NOT all five: the sumo-api career/rank pull (~3 calls x 42 wrestlers) is heavy and
        # mostly basho-STATIC, while the daily-changing pieces (crew record, kimarite, caliber, henka) come
        # from Notion — so at most twice a day. The 03:32 PM run is a backstop in case GitHub silently
        # drops the morning cron (the same resilience reason there are five publish crons). The output
        # carries no per-run timestamp, so a second same-day run writes identical bytes and the commit
        # gate below skips it — no churn. Non-fatal: a hiccup or a partial sumo-api miss leaves the last
        # good JSON in place (the generator is blank-not-faked). The FULL career refresh also rides the
        # banzuke drop via the gen-rikishi-metrics dispatch.
        # NOTE (2026-09-19): on a fan-triggered publish the event is repository_dispatch, so this step
        # correctly SKIPS (not workflow_dispatch, no schedule match) — standings + snapshot still rebuild.
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '32 15 * * *' || github.event.schedule == '32 22 * * *' }}
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node gen-rikishi-metrics.mjs

      - name: Verify per-rikishi metrics (independent dashboard publish gate)
        # THE 9.5→10 GATE (2026-09-23). The dashboard renders client-side from rikishi-metrics.json, so
        # this is the adversarial second pass on THAT artifact: an independently-written re-pull of
        # sumo-api + Notion reconciles every hard figure, plus cross-field invariants (makuuchi ≤ career,
        # caliber per-basho sums == crew record, kimarite slices sum to 100, specials count ≥ its chips,
        # pct strings recompute), the firewall + house style (no macrons, no transcript-sourced hard slot,
        # sample never shipped, expiring-portrait freshness), and — when ANTHROPIC_API_KEY is present — a
        # fresh-context model pass over the soft copy for age-relative / soft-as-hard claims and AI tells.
        # It exits non-zero on any BLOCKING exception. Runs right after the metrics rebuild, same gate, so
        # the heavy re-pull only fires on the two metrics crons + manual runs. continue-on-error keeps the
        # job going (standings/snapshot still publish) — but the commit step below refuses to STAGE
        # rikishi-metrics.json when this outcome is 'failure', so a bad dashboard never publishes (the last
        # good one stays live), and the final step turns the whole run RED so the failure can't be ignored.
        # ANTHROPIC_API_KEY is OPTIONAL: unset → the deterministic gate still runs, the model layer is
        # simply skipped. STRICT_SOURCE stays off so a sumo-api outage warns rather than wedging publish.
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '32 15 * * *' || github.event.schedule == '32 22 * * *' }}
        id: verify_metrics
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node verify-rikishi-metrics.mjs

      - name: Commit & push if anything changed
        # FIX 2026-07-30: stage FIRST, then check the staged diff. The old gate used
        # `git diff --quiet -- <paths>`, which only sees TRACKED files — so a regenerated
        # but UNTRACKED _snapshot.js (e.g. after the folder was deleted/recreated) was invisible
        # to the check and never committed, especially once the basho ended and standings stopped
        # changing. Staging before checking makes the check and the action agree on what they see.
        run: |
          git config user.name "sumo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add standings.html index.html functions/api/_snapshot.js functions/api/_calendar.js drinking-game.html
          # rikishi-metrics.json may be absent on a run where the (gated, continue-on-error) metrics
          # rebuild didn't run or bailed. `git add <missing-path>` is FATAL under bash -e and would fail
          # this whole step — stopping standings + snapshot from ever committing. Add it only if present.
          # DASHBOARD GATE (2026-09-23): and only when the independent verifier did NOT block. On a
          # 'failure' outcome we hold the file back so the last good dashboard data stays live; on a
          # non-rebuild run the verify step is 'skipped' (!= failure), so the unchanged file stages as a
          # no-op exactly as before. The run still goes red via the final step below.
          if [ -f rikishi-metrics.json ] && [ "${{ steps.verify_metrics.outcome }}" != "failure" ]; then
            git add rikishi-metrics.json
          elif [ -f rikishi-metrics.json ]; then
            echo "rikishi-metrics.json NOT staged — the dashboard verifier flagged a blocking exception; last good dashboard data stays live."
          fi
          # calendar.json is created by gen-calendar.mjs; it won't exist until the first successful run
          # (and the generator self-aborts on an empty pull). Add it only if present, same guard.
          if [ -f calendar.json ]; then git add calendar.json; fi
          # tomorrow-card.json is written by gen-torikumi.mjs (continue-on-error, and it self-aborts to an
          # empty card off-basho / on a 404), so it may be absent — same present-only guard as the others,
          # so a missing card can never fail this step and block standings + snapshot from committing.
          # (The lineup ALSO lands in Notion now — that write produces no file, so nothing to add here.)
          if [ -f tomorrow-card.json ]; then git add tomorrow-card.json; fi
          if git diff --cached --quiet; then
            echo "No change — nothing to publish."
          else
            git commit -m "Auto-update standings + homepage + Gumbai snapshot + tomorrow's card + drinking game + calendar + rikishi metrics ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

      - name: Fail the run if the dashboard verifier blocked
        # Runs AFTER the commit, so standings/snapshot/etc. have already published. This turns the whole
        # run RED when the verifier held back rikishi-metrics.json, so a genuine dashboard problem is loud
        # (email/badge) and gets a human's eyes — the "ignoring errors is not good form" rule — without
        # ever blocking the other surfaces from shipping.
        if: ${{ steps.verify_metrics.outcome == 'failure' }}
        run: |
          echo "::error::Dashboard verifier found BLOCKING exceptions — rikishi-metrics.json was held back (last good stays live). See the 'Verify per-rikishi metrics' step log for the exception report."
          exit 1
