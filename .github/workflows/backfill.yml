name: Historical backfill (one-time)

# Manual only — run this ONCE to pull the crew's fandom era (Jan 2025 → May 2026)
# from sumo-api and commit sumo-history.json. History is static; no schedule.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull historical basho from sumo-api
        run: node gen-history.mjs

      - name: Commit sumo-history.json
        run: |
          git config user.name "sumo-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- sumo-history.json; then
            echo "No change."
          else
            git add sumo-history.json
            git commit -m "Historical backfill: Jan 2025 – May 2026 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
