# .github/workflows/backfill-pass2.yml
# Manual, one-time historical enrichment into Notion (Pass 2). Reads sumo-history.json,
# writes Tournament-linked Banzuke + orphan rikishi + historical bouts into Notion.
# DRY_RUN defaults to "1" — the first run is a census (no writes). Flip to "0" to write.
name: backfill-pass2

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run? 1 = census only (no writes), 0 = actually write'
        required: true
        default: '1'
      only_basho:
        description: 'Optional: limit to bashoIds, comma-separated (e.g. 202601,202603). Blank = all 9.'
        required: false
        default: ''

jobs:
  backfill-pass2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Pass 2
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ONLY_BASHO: ${{ github.event.inputs.only_basho }}
        run: node gen-backfill-pass2.mjs
