name: Fan-out + publish (keystone)

# The keystone: one spine, three entry points, off the flaky Cowork session.
#   Pass 1 (box-push, FAST PATH) -> run-live.sh confirms the transcript push, fires repository_dispatch
#                          (transcript-landed). The fan runs the instant the transcript lands.
#   Pass 1 (schedule, BELT)      -> a few afternoon crons during the basho window catch a MISSED dispatch
#                          (box offline, token expired, dispatch failed). The fan is idempotent, so a
#                          belt run on an already-fanned day is a free no-op. This replaces the old
#                          Cowork fan triggers (which hung at session start) with CI-native cron.
#   Pass 2 (Jennie)              -> workflow_dispatch with mode=pass2, after scorekeeper notes are on the row.
# fan.mjs (Claude API, same key Gumbai uses) writes color to Notion; deterministic code holds every
# rail. Then the publish job (reusable) rebuilds standings + Gumbai snapshot from Notion and commits,
# so the drinking-game board reflects the fan immediately - no waiting for the next publish cron.

on:
  repository_dispatch:
    types: [transcript-landed]      # Pass 1 FAST PATH - fired by the box after a confirmed push
  schedule:
    # Pass 1 BELT. Basho window only (odd months = the 6 honbasho; days 8-27 covers every basho's run).
    # Times are UTC and land AFTER the box's ~17:14 UTC transcript push, so if the dispatch was missed
    # the fan still catches the landed row. Multiple attempts = resilient to GitHub dropping any one cron.
    # Off-window / off-day these never fire; an on-day run with the day already fanned is a no-op (no API spend).
    - cron: "45 17 8-27 1,3,5,7,9,11 *"   # ~10:45 AM PT - shortly after the transcript lands
    - cron: "30 19 8-27 1,3,5,7,9,11 *"   # ~12:30 PM PT - midday catch
    - cron: "30 21 8-27 1,3,5,7,9,11 *"   # ~2:30 PM PT  - afternoon backstop (also covers a late VOD recapture)
  workflow_dispatch:                # Pass 2 (scorekeeper) or a manual re-run / rehearsal
    inputs:
      mode:
        description: "pass1 (transcript) or pass2 (scorekeeper notes)"
        type: choice
        options: [pass1, pass2]
        default: pass1
      day:
        description: "Day # to process (blank = today's ready row)"
        default: ""
      dry_run:
        description: "1 = rehearse the fan, write NOTHING to Notion, skip publish"
        default: "0"

permissions:
  contents: write                   # publish job commits standings/snapshot

concurrency:
  group: fan-publish
  cancel-in-progress: false         # never cut a half-written fan off mid-flight

jobs:
  fan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fan color to Notion (model extracts, code enforces the rails)
        env:
          NOTION_TOKEN:      ${{ secrets.NOTION_TOKEN_WRITE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL:   ${{ vars.ANTHROPIC_MODEL }}
          RESEND_KEY:        ${{ secrets.RESEND_KEY }}
          ALERT_EMAIL:       ${{ secrets.ALERT_EMAIL }}
          ALERT_FROM:        ${{ secrets.ALERT_FROM }}
          # MODE: only a manual workflow_dispatch chooses the mode. repository_dispatch (fast path) AND
          # schedule (belt) both mean Pass 1. The old expression left MODE blank on a scheduled run.
          MODE:    ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'pass1' }}
          DAY:     ${{ github.event.client_payload.day || github.event.inputs.day || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: node fan.mjs

  publish:
    needs: fan
    if: ${{ always() && (github.event.inputs.dry_run || '0') != '1' }}
    uses: ./.github/workflows/publish.yml
    secrets: inherit
