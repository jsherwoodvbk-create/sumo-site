<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Banzuke Predictions · Salt Stats &amp; Sumo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Zen+Old+Mincho:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1e9db; --surface:#fbf7ef; --ink:#26262b; --muted:#6f695d; --line:#e2d9c7;
    --clay:#a9742c; --clay-soft:#e6cf9f; --purple:#6a3d9a; --vermilion:#cf5a2c;
    --win:#227a4b; --loss:#a93327; --up:#227a4b; --down:#a93327;
    --maeg-hi:#46536b; --maeg-lo:#746a52;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#171719; --surface:#212127; --ink:#ece4d4; --muted:#a49c8b; --line:#33333b;
      --clay:#d2a35c; --clay-soft:#40331d; --purple:#b892e4; --vermilion:#e5814f;
      --win:#49bd82; --loss:#e06a5c; --up:#49bd82; --down:#e06a5c;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  h1,h2{font-family:'Zen Old Mincho',Georgia,'Times New Roman',serif}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:880px;margin:0 auto;padding:14px 16px 60px}
  /* home crest — the crew mark, tap back to the hub */
  .homecrest{width:34px;height:34px;border-radius:50%;flex:0 0 auto;margin-left:auto;overflow:hidden;
    background:#efe7d5;box-shadow:0 0 0 1px rgba(255,255,255,.30),0 2px 6px rgba(0,0,0,.28);
    transition:transform .12s ease, box-shadow .12s ease}
  .homecrest:hover{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(255,255,255,.55),0 5px 13px rgba(0,0,0,.34)}
  .homecrest img{width:100%;height:100%;object-fit:cover;display:block}
  header{
    background:
      repeating-linear-gradient(178deg, rgba(0,0,0,.14) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 44px),
      linear-gradient(160deg,#6e4826,#432a15);
    color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:14px;border:1px solid #38230f;
    box-shadow:0 8px 22px rgba(50,30,10,.28)}
  .hbrand{display:flex;align-items:center;gap:14px}
  .hbrand .icon{width:48px;height:48px;flex:0 0 auto}
  header h1{font-size:23px;margin:0 0 2px;font-weight:900}
  header p{margin:0;opacity:.9;font-size:13.5px}
  .intro{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 8px}
  .savebar{position:sticky;top:0;z-index:4;background:var(--bg);padding:10px 0;
    display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:6px}
  button.save{background:var(--vermilion);color:#fff;border:0;border-radius:8px;padding:9px 18px;
    font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:filter .12s ease}
  button.save:hover{filter:brightness(1.08)} button.save:disabled{opacity:.6;cursor:default}
  .status{font-size:13px;color:var(--muted)} .status.dirty{color:var(--vermilion);font-weight:600}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px;min-width:560px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th{background:var(--clay-soft);font-size:11px;color:var(--clay);
    text-transform:uppercase;letter-spacing:.03em}
  @media (prefers-color-scheme:dark){thead th{color:var(--clay)}}
  tbody tr:nth-child(even){background:rgba(0,0,0,.03)}
  td.rec{color:var(--muted)}
  .rk{display:inline-block;min-width:30px;text-align:center;font-size:11px;font-weight:800;color:#fff;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .r-yok{background:var(--purple)} .r-ozeki{background:var(--vermilion)} .r-seki{background:var(--clay)}
  .r-komu{background:var(--win)} .r-maeg-hi{background:var(--maeg-hi)} .r-maeg-lo{background:var(--maeg-lo)}
  .r-jur{background:#c4b8a0;color:#5c5342} .r-ret{background:var(--line);color:var(--muted)}
  td.kk{color:var(--win);font-weight:600} td.mk{color:var(--loss);font-weight:600}
  td.delta{font-weight:600;text-align:center;width:52px}
  td.delta.up{color:var(--up)} td.delta.down{color:var(--down)} td.delta.zero{color:var(--muted)}
  select{font:inherit;font-size:13.5px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--ink);width:120px}
  input.name{font:inherit;font-size:13.5px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--ink);width:190px}
  h2{font-size:15px;color:var(--vermilion);margin:26px 0 3px}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 8px}
  .bonus td.n{width:28px;color:var(--muted)}
  .loading{color:var(--muted);padding:24px 0}
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <filter id="inkS" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="coinClip"><circle cx="60" cy="60" r="55"/></clipPath>
    <symbol id="ic-prediction" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="58" fill="#efe7d5"/>
      <circle cx="60" cy="60" r="55.5" fill="none" stroke="#c06a34" stroke-width="4.5"/>
      <circle cx="60" cy="60" r="49" fill="none" stroke="#c06a34" stroke-width="1.3"/>
      <g clip-path="url(#coinClip)" filter="url(#inkS)">
        <g fill="none" stroke="#211a12" stroke-width="3"><circle cx="55" cy="66" r="15"/><circle cx="55" cy="66" r="8"/></g>
        <circle cx="55" cy="66" r="3.4" fill="#b23a2e"/>
        <line x1="86" y1="37" x2="59" y2="62" stroke="#211a12" stroke-width="3" stroke-linecap="round"/>
        <path d="M59 62 l8 -1.5 l-3.5 -6.5 Z" fill="#211a12"/>
        <path d="M86 37 l1 -6 M86 37 l6 -1" stroke="#211a12" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      </g>
    </symbol>
  </defs></svg>

<div class="wrap">
  <header>
    <div class="hbrand">
      <svg class="icon" viewBox="0 0 120 120" aria-hidden="true"><use href="#ic-prediction"/></svg>
      <div>
        <h1>Banzuke Predictions</h1>
        <p>Call the next banzuke before it's official. The crew vs. the machine.</p>
      </div>
      <a class="homecrest" href="/app" title="Crew home" aria-label="Crew home"><img src="/salt-stats-sumo-badgeold.png" alt=""></a>
    </div>
  </header>

  <p class="intro" id="intro">Loading…</p>
  <div class="savebar">
    <button class="save" id="saveBtn">Save picks</button>
    <span class="status" id="status">·</span>
  </div>
  <div id="body"><p class="loading">Loading the roster…</p></div>
</div>

<script>
(function () {
  var RANKS=[['y','Yokozuna'],['o','Ozeki'],['s','Sekiwake'],['k','Komusubi']];
  for (var i=1;i<=18;i++) RANKS.push(['m'+i,'M'+i]);
  RANKS.push(['j','Juryo'],['r','Retired']);

  function rankValue(x){
    if(x===null||x===undefined||x==='') return null;
    var r=String(x).toLowerCase().trim();
    if(r.indexOf('yoko')===0||r==='y') return 1;
    if(r.indexOf('oze')===0||r==='o') return 2;
    if(r.indexOf('seki')===0||r==='s') return 3;
    if(r.indexOf('komu')===0||r==='k') return 4;
    var m=r.match(/(?:maegashira|m)\s*(\d+)/); if(m) return 4+parseInt(m[1],10);
    if(r.indexOf('juryo')===0||r==='j') return 23;
    if(r.indexOf('retire')===0||r==='r') return 24;
    return null;
  }
  // rank → standings tier class (maegashira splits at M8, same as standings/reports)
  function rankClass(x){
    var v=rankValue(x); if(v===null) return '';
    if(v===1) return 'r-yok'; if(v===2) return 'r-ozeki'; if(v===3) return 'r-seki'; if(v===4) return 'r-komu';
    if(v>=5&&v<=12) return 'r-maeg-hi'; if(v>=13&&v<=22) return 'r-maeg-lo';
    if(v===23) return 'r-jur'; return 'r-ret';
  }

  var state={ basho:'', roster:[], ranks:{}, bonus:[], dirty:false, savedAt:null };

  function markDirty(){ state.dirty=true; setStatus(); }
  function setStatus(msg,cls){
    var el=document.getElementById('status');
    if(msg!==undefined){ el.textContent=msg; el.className='status'+(cls?(' '+cls):''); return; }
    if(state.dirty){ el.textContent='Unsaved changes'; el.className='status dirty'; }
    else { el.textContent=state.savedAt?('Saved ✓ '+new Date(state.savedAt).toLocaleString()):'No picks saved yet'; el.className='status'; }
  }
  function ensureBonus(i){ if(!state.bonus[i]) state.bonus[i]={name:'',rank:''}; return state.bonus[i]; }

  function rankSelect(value,onchange){
    var s=document.createElement('select');
    var blank=document.createElement('option'); blank.value=''; blank.textContent='·'; s.appendChild(blank);
    RANKS.forEach(function(r){ var o=document.createElement('option'); o.value=r[0]; o.textContent=r[1]; if(r[0]===value)o.selected=true; s.appendChild(o); });
    s.addEventListener('change',onchange); return s;
  }
  function setDelta(td,currentRank,pickCode){
    var cv=rankValue(currentRank), pv=rankValue(pickCode);
    if(cv===null||pv===null){ td.textContent='·'; td.className='delta zero'; return; }
    var d=cv-pv;
    if(d>0){ td.textContent='+'+d; td.className='delta up'; }
    else if(d<0){ td.textContent=String(d); td.className='delta down'; }
    else { td.textContent='0'; td.className='delta zero'; }
  }

  function render(){
    document.getElementById('intro').textContent=
      'Predict where each wrestler lands on the '+state.basho+' banzuke. Last basho’s record and KK/MK are your guide. '+
      'Rank Δ shows how far your pick moves them (+ up / − down), a quick sanity check on each call. '+
      'Below: up to 7 juryo→makuuchi promotions (−1 each correct). Retiring? Pick “Retired”.';
    var body=document.getElementById('body'); body.innerHTML='';

    var scroll=document.createElement('div'); scroll.className='scroll';
    var t=document.createElement('table');
    t.innerHTML='<thead><tr><th>Wrestler</th><th>Rank</th><th>W–L</th><th>KK/MK</th><th>Your pick</th><th>Δ</th></tr></thead>';
    var tb=document.createElement('tbody');
    state.roster.forEach(function(w){
      var tr=document.createElement('tr');
      var name=document.createElement('td'); name.textContent=w.name;
      var rank=document.createElement('td'); rank.className='rank';
      if(w.rank){ var rchip=document.createElement('span'); rchip.className='rk '+rankClass(w.rank); rchip.textContent=w.rank; rank.appendChild(rchip); }
      var rec=document.createElement('td'); rec.className='rec'; rec.textContent=w.record||'';
      var kk=document.createElement('td'); kk.textContent=w.kkmk||''; kk.className=w.kkmk==='KK'?'kk':(w.kkmk==='MK'?'mk':'');
      var pick=document.createElement('td');
      var delta=document.createElement('td');
      var sel=rankSelect(state.ranks[w.name]||'', function(e){ state.ranks[w.name]=e.target.value; setDelta(delta,w.rank,e.target.value); markDirty(); });
      pick.appendChild(sel);
      setDelta(delta,w.rank,state.ranks[w.name]||'');
      tr.appendChild(name); tr.appendChild(rank); tr.appendChild(rec); tr.appendChild(kk); tr.appendChild(pick); tr.appendChild(delta);
      tb.appendChild(tr);
    });
    t.appendChild(tb); scroll.appendChild(t); body.appendChild(scroll);

    var h=document.createElement('h2'); h.textContent='Juryo → Makuuchi promotions'; body.appendChild(h);
    var sub=document.createElement('p'); sub.className='sub'; sub.textContent='Up to 7: name + the rank you think they debut at. −1 off your score per exact hit.'; body.appendChild(sub);
    var bt=document.createElement('table'); bt.style.minWidth='0'; bt.className='bonus'; var btb=document.createElement('tbody');
    for(var i=0;i<7;i++){ (function(idx){
      var bn=state.bonus[idx]||{name:'',rank:''};
      var tr=document.createElement('tr');
      var n=document.createElement('td'); n.className='n'; n.textContent=(idx+1);
      var nm=document.createElement('td'); var inp=document.createElement('input');
      inp.className='name'; inp.type='text'; inp.placeholder='Wrestler name'; inp.value=bn.name;
      inp.addEventListener('input',function(e){ ensureBonus(idx).name=e.target.value; markDirty(); }); nm.appendChild(inp);
      var rk=document.createElement('td'); rk.appendChild(rankSelect(bn.rank,function(e){ ensureBonus(idx).rank=e.target.value; markDirty(); }));
      tr.appendChild(n); tr.appendChild(nm); tr.appendChild(rk); btb.appendChild(tr);
    })(i); }
    bt.appendChild(btb); body.appendChild(bt);
    setStatus();
  }

  function save(){
    var btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent='Saving…';
    var bonus=state.bonus.filter(function(b){ return b && (b.name||'').trim(); });
    fetch('/api/app/prediction',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({picks:{ranks:state.ranks, bonus:bonus}})})
      .then(function(r){return r.json();})
      .then(function(d){ if(d.ok){ state.dirty=false; state.savedAt=d.savedAt; } setStatus(); })
      .catch(function(){ setStatus('Save failed. Try again.','dirty'); })
      .finally(function(){ btn.disabled=false; btn.textContent='Save picks'; });
  }
  document.getElementById('saveBtn').addEventListener('click',save);

  Promise.all([
    fetch('/api/app/roster').then(function(r){return r.ok?r.json():{};}),
    fetch('/api/app/prediction').then(function(r){return r.ok?r.json():null;})
  ]).then(function(res){
    var rd=res[0]||{}, saved=res[1]||{};
    state.basho=(saved&&saved.basho)||rd.basho||'the next';
    state.roster=rd.roster||[];
    var p=(saved&&saved.picks)||{};
    state.ranks=p.ranks||{}; state.bonus=p.bonus||[]; state.savedAt=saved&&saved.savedAt;
    render();
  }).catch(function(){ document.getElementById('body').innerHTML='<p class="loading">Couldn’t load the roster. Refresh to try again.</p>'; });
})();
</script>
</body>
</html>
